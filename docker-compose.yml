services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bizbazar
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # These scripts run automatically on first start (alphabetical order)
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"   # exposes Postgres so you can connect with a DB client
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizbazar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express API server ─────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      PORT:        5001
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     bizbazar
      DB_USER:     postgres
      DB_PASSWORD: postgres
    ports:
      - "5001:5001"   # optional: exposes the API directly for debugging
    depends_on:
      db:
        condition: service_healthy

  # ── React frontend (Nginx) ─────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    ports:
      - "80:80"       # the app is available at http://localhost
    depends_on:
      - server

volumes:
  postgres_data:   # persists database data between container restarts
